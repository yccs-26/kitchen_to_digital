[project]
name = "kitchen-to-digital"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.15.1",
    "fastavro>=1.12.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
msk = [
    "aws-msk-iam-sasl-signer-python>=1.0.2",
    "kafka-python>=2.3.2,<3",
]

[tool.pytest.ini_options]
markers = ["integration: requires running Kafka and Schema Registry; writes test records"]
