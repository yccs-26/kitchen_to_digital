[project]
name = "kitchen-sensor-simulator"
version = "0.1.0"
description = "Async kitchen sensor event producer for Kafka"
requires-python = ">=3.11"
dependencies = [
    "clear>=2.0.0",
    "confluent-kafka>=2.6,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
